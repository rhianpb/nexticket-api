# Nome da aplicação Spring Boot
spring.application.name=nexticket-api


# =========================
# BANCO DE DADOS
# =========================

# URL de conexão com o PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/nexticket

# Usuário do PostgreSQL
spring.datasource.username=postgres

# Senha obtida através da variável de ambiente DB_PASSWORD.
# Evita deixar a senha diretamente no código/versionamento.
spring.datasource.password=${DB_PASSWORD}


# =========================
# JPA / HIBERNATE
# =========================

# Hibernate não cria nem altera tabelas.
# Apenas verifica se as entidades Java estão compatíveis com o banco.
# A criação/evolução do schema fica sob responsabilidade do Flyway.
spring.jpa.hibernate.ddl-auto=validate

# Exibe no console os comandos SQL executados pelo Hibernate.
spring.jpa.show-sql=true

# Formata o SQL exibido no console para facilitar a leitura.
spring.jpa.properties.hibernate.format_sql=true